# =======================================================
# DiffVax — FLUX.2 Klein EDIT-MODE 1088px run (plan phase P3.4)
# =======================================================
# Warm-starts from the best 512px checkpoint of configs/klein_edit_512.yml
# (pass it with --checkpoint, which overrides load_path) and grows
# 768 -> 1024 -> 1088. EoT is ON here: the target use case is images posted
# to social media (resize + JPEG). Only start this AFTER the 512px signal
# run passes its gate and scripts/eval_protocol.py shows protection above the
# noise control.
#
# Hardware: one 80 GB GPU. Klein sees references above 1024*1024 pixels
# SHRUNK to that area (the real pipeline does this), so a 1088px image is
# edited at ~1008-1024px; the surrogate reproduces that resize.
# Measure peak VRAM at each curriculum stage with scripts/profile_memory.py.

iter_num: 40                # total epochs across all stages
learning_rate: 0.00001
batch_size: 1
alpha: 1
beta: 0.5
epsilon: 16
num_inference_steps: 4
hold_batches: 1

immunization_model: "diffvax"
train_all: true
project_name: "diffvax-klein-edit-1088"

resolution: 768
sd_target_resolutions: [512]
strength_range: [0.5, 1.0]

load_existing: false        # supply the 512px checkpoint via --checkpoint

attack_model_link: "runwayml/stable-diffusion-inpainting"
sd_probability: 0.0
sd3_model_link: null
sd3_probability: 0.0
flux_model_link: "black-forest-labs/FLUX.2-klein-4B"
flux_probability: 1.0

flux_attack:
  mode: "edit"
  gradient_timestep_fraction: 0.5
  use_gradient_checkpointing: true
  guidance_scale: 4.0
  max_reference_area: 1048576
  offload_text_encoder: false

noise_target:
  enabled: false

# Social-media pipeline simulation. Resize range kept conservative at 1088px.
eot:
  enabled: true
  jpeg_quality_range: [70, 95]
  resize_range: [0.7, 1.3]
  blur_sigma_range: [0.0, 1.5]
  noise_std_range: [0.0, 0.02]
  p_jpeg: 0.8
  p_resize: 0.5
  p_blur: 0.3
  p_noise: 0.3

clip_loss:
  enabled: false
spectral_loss:
  enabled: true
  low_freq_radius: 0.1
  weight: 0.5
latent_loss:
  enabled: true
  mode: "l2"
  weight: 0.5
hidden_state_loss:
  enabled: true
  weight: 0.5
  group: "single"
  target_blocks: "middle"
  num_hooks: 4
  sigma: 1.0
attention_loss:
  enabled: false
flat_minima:
  enabled: false
adaptive_ensemble:
  enabled: false

# Epoch boundaries are cumulative (until_epoch is exclusive).
curriculum:
  enabled: true
  resolution_jitter: 0.0
  stages:
    - resolution: 768
      until_epoch: 10
      batch_size: 1
    - resolution: 1024
      until_epoch: 25
      batch_size: 1
    - resolution: 1088
      until_epoch: 40
      batch_size: 1

perturbation_mask_gating: false
max_grad_norm: 5.0

# 1088px person-mask dataset (PRIVATE: the pod needs HF_TOKEN with read
# access). Without this key train.py would fetch the original 512px dataset.
dataset_repo: "sbartlett97/diffvax-high-res"
images_subdir: "train/images"
masks_subdir: "train/masks"

dataloader:
  num_workers: 4
  prefetch_factor: 2

hub:
  enabled: false
  repo_id: null
  private: true
  token: null
  upload_every_n_epochs: 10

# Live tracking. The Discord webhook is read from the DISCORD_WEBHOOK env var
# (never put the URL in this file). Trackio logs locally unless space_id is
# set (then it syncs to that Hugging Face Space; needs HF_TOKEN).
reporting:
  webhook_url: null
  progress_every_minutes: 10
  price_per_hour: 1.79
  label: "diffvax"
  trackio:
    enabled: true
    project: "diffvax-klein"
    log_every_n_steps: 10
    space_id: null
  checkpoint_every_n_epochs: 5
