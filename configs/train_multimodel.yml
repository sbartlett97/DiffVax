# DiffVax multi-model training configuration (H1a experiment)
# Each training step randomly routes to SD 1.5 (25%) or FLUX.1-schnell (75%)
# to force the immunizer to generalize across UNet and DiT architectures.

# Training
# iter_num: kept high — actual run length controlled by max_steps
# max_steps: 8000 gradient updates × ~20s/step ≈ 44h on A100 95GB
iter_num: 10000
max_steps: 8000
learning_rate: 0.000005
batch_size: 1
alpha: 4

# Model
immunization_model: "diffvax"
train_all: true
project_name: "diffvax_multimodel"

# Resolution
resolution: 512

# Attack model: Stable Diffusion Inpainting (SD 1.5 UNet, 4-ch VAE)
attack_model_link: "runwayml/stable-diffusion-inpainting"
sd_probability: 0.25

# Attack model: FLUX.1-schnell (distilled DiT, 16-ch VAE, 4 denoising steps)
flux_model_link: "black-forest-labs/FLUX.1-schnell"
flux_probability: 0.75

# Dataset paths (relative to data_dir)
images_subdir: "train/images"
masks_subdir: "train/masks"
