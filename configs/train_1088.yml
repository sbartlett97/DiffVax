# DiffVax 1088x1088 fine-tuning configuration (Stage 2 — H3 experiment)
# Loads a 512-trained checkpoint and fine-tunes at 1088x1088 resolution.
# Resolution chosen to match typical social media uploads (Instagram: 1080px).

# Training
iter_num: 50000
learning_rate: 0.000003
batch_size: 1
alpha: 4

# Model
immunization_model: "diffvax"
train_all: true
project_name: "diffvax_1088"

# Resolution
resolution: 1088

# Load 512-trained checkpoint (stage 1)
load_existing: true
load_path: "checkpoints/diffvax_trained.pth"

# Attack model: SD 1.5 Inpainting (primary — has 1088 support via native stride)
attack_model_link: "runwayml/stable-diffusion-inpainting"
sd_probability: 0.3

# Attack model: FLUX.2 Klein 4B
flux_model_link: "black-forest-labs/FLUX.1-schnell"
flux_probability: 0.7

# Dataset paths for 1088 images (relative to data_dir)
# Generate 1088 versions with: python scripts/generate_masks.py --size 1088
images_subdir: "train_1088/images"
masks_subdir: "train_1088/masks"
image_prompt_json: "image_prompt_pairs_with_validation.json"
