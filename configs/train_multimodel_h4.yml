# DiffVax H4 experiment: VAE feature-space loss for cross-model transfer
# Adds beta * (-||VAE(x+delta) - VAE(x)||^2) to the training objective.
# Uses stabilityai/sd-vae-ft-mse as shared VAE.

# Training
iter_num: 10000
learning_rate: 0.000005
batch_size: 1
alpha: 4

# H4: VAE feature loss weight (0 = disabled, 0.5 = H4 experiment value)
vae_loss_beta: 0.5

# Model
immunization_model: "diffvax"
train_all: true
project_name: "diffvax_h4_vae_loss"

# Resolution
resolution: 512

# Attack models (same as H1a for fair comparison)
attack_model_link: "runwayml/stable-diffusion-inpainting"
sd_probability: 0.25

flux_model_link: "black-forest-labs/FLUX.1-schnell"
flux_probability: 0.75

# Dataset paths (relative to data_dir)
images_subdir: "train/images"
masks_subdir: "train/masks"
image_prompt_json: "image_prompt_pairs_with_validation.json"

load_existing: false
