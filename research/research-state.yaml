known_constraints:
  - "No local GPU. All experiments require cloud/cluster submission (Modal, Lambda Labs)."
  - "gpt-image-edit is a black-box API — cannot do differentiable attacks through it. Transfer-only."
  - "FLUX attention hook manager captures attn maps only when model returns them — may need to patch diffusers to get maps in all cases."
  - "SD 3.5 may require bfloat16 (not float16) on some GPU configs."

